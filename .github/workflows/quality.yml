name: Quality Gate
on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "latest"
      - name: Install deps
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy bf_price_monitor/
      - name: Test + coverage
        run: uv run pytest --cov=bf_price_monitor --cov-report=term-missing --cov-fail-under=70
