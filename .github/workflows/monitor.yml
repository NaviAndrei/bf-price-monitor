name: Price Monitor

# ============================================================================
# WARNING — SELF-HOSTED RUNNER IS REGISTERED ON THE OWNER'S PERSONAL MACHINE.
# This repo is PUBLIC. Do NOT add a `pull_request` or `pull_request_target`
# trigger to this or any other workflow in this repo while that runner is
# registered — either trigger lets a forked PR execute arbitrary code on
# the runner host. If a PR-based trigger is ever needed, either scope it to
# `runs-on: ubuntu-latest` (GitHub-hosted, disposable) instead of
# `self-hosted`, or unregister the self-hosted runner first.
# ============================================================================

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Scrape prices
        run: python scripts/scrape.py

      - name: Analyze alerts
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/analyze.py

      - name: Send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify.py

      - name: Commit updated price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/price_history.json data/watchlist.json
          git diff --staged --quiet || git commit -m "chore: update price history [skip ci]"
          git push
