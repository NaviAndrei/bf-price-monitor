name: Price Monitor

# ============================================================================
# WARNING — SELF-HOSTED RUNNER IS REGISTERED ON THE OWNER'S PERSONAL MACHINE.
# This repo is PUBLIC. Do NOT add a `pull_request` or `pull_request_target`
# trigger to this or any other workflow in this repo while that runner is
# registered — either trigger lets a forked PR execute arbitrary code on
# the runner host. If a PR-based trigger is ever needed, either scope it to
# `runs-on: ubuntu-latest` (GitHub-hosted, disposable) instead of
# `self-hosted`, or unregister the self-hosted runner first.
# ============================================================================

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

# Deny-all by default; each job below grants back only what its own steps
# need (T-14, #21). GitHub Actions permissions are set per job, not per
# step, so the single previous job -- which only needed `contents: write`
# for its last step -- is split in two: everything before the commit runs
# read-only, and only the persistence job gets write access.
permissions: {}

concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  scrape-analyze-notify:
    runs-on: self-hosted
    permissions:
      contents: read
    env:
      PYTHON: C:\Program Files\Python312\python.exe
      # Pinned explicitly, same reasoning as PYTHON above: the runner service
      # account (NETWORK SERVICE) has its own profile, separate from the
      # interactive user's %LOCALAPPDATA%\ms-playwright default cache, so the
      # install step and the scrape step must agree on one fixed location
      # rather than relying on whichever account's per-profile default wins.
      PLAYWRIGHT_BROWSERS_PATH: C:\actions-runner\ms-playwright-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # This job never pushes, so the checkout token (already read-only
          # via the job's `permissions` block) shouldn't even be left sitting
          # in .git/config for the rest of the job to find.
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "latest"

      # uv sync installs from uv.lock with hash verification (uv.lock records
      # a sha256 per sdist/wheel) and installs the local bf_price_monitor
      # package directly from this checkout -- unlike pip's --require-hashes,
      # it doesn't refuse a local directory source, so both the pinned
      # third-party deps and the project itself go through one verified path.
      # --python pins the venv to the same interpreter NETWORK SERVICE can
      # see; every later `uv run` reuses that venv without re-specifying it.
      - name: Install dependencies
        run: uv sync --frozen --python "$env:PYTHON"

      - name: Install Playwright browser
        run: uv run playwright install chromium

      - name: Scrape prices
        run: uv run scripts/scrape.py

      - name: Analyze alerts
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run scripts/analyze.py

      - name: Send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run scripts/notify.py

      # This job has no write permission, so the updated data files can only
      # leave it via an artifact -- the persist job below downloads this
      # instead of trusting a shared runner filesystem between jobs.
      - name: Upload updated data files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: price-data
          path: |
            data/price_history.json
            data/watchlist.json
          retention-days: 1

  persist:
    needs: scrape-analyze-notify
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: price-data
          path: data

      - name: Commit updated price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/price_history.json data/watchlist.json
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: update price history [skip ci]"

            # Overlapping runs on this persistent self-hosted runner can each
            # start from the same origin/master tip and race to push -- rebase
            # onto the current remote tip immediately before pushing so a run
            # that finishes second integrates the other run's commit instead
            # of getting a non-fast-forward rejection.
                        if (Test-Path ".git/rebase-merge") { Remove-Item -Recurse -Force ".git/rebase-merge" }
            if (Test-Path ".git/rebase-apply") { Remove-Item -Recurse -Force ".git/rebase-apply" }
            git pull --rebase origin master
            if ($LASTEXITCODE -ne 0) {
              Write-Error "git pull --rebase failed -- likely a genuine content conflict in data/price_history.json between two runs' commits, not just the race this rebase is meant to absorb. Aborting the rebase so this persistent runner's checkout isn't left mid-rebase and blocking every subsequent scheduled run."
              git rebase --abort
              exit 1
            }

            git push
            if ($LASTEXITCODE -ne 0) {
              Write-Error "git push failed even after a successful rebase -- unexpected; needs manual investigation rather than a blind retry."
              exit 1
            }
          }

      - name: Ping healthcheck
        if: ${{ success() }}
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HEALTHCHECK_URL)) {
            Write-Output "[healthcheck] HEALTHCHECK_URL not set, skipping"
            exit 0
          }

          try {
            $response = Invoke-WebRequest -Uri $env:HEALTHCHECK_URL -TimeoutSec 15
            if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 300) {
              Write-Output "[healthcheck] ping succeeded"
            } else {
              Write-Warning "[healthcheck] ping failed or returned a non-success status; monitor job remains successful"
            }
          } catch {
            Write-Warning "[healthcheck] ping failed or returned a non-success status; monitor job remains successful"
          }

