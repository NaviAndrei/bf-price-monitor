name: Price Monitor

# ============================================================================
# WARNING — SELF-HOSTED RUNNER IS REGISTERED ON THE OWNER'S PERSONAL MACHINE.
# This repo is PUBLIC. Do NOT add a `pull_request` or `pull_request_target`
# trigger to this or any other workflow in this repo while that runner is
# registered — either trigger lets a forked PR execute arbitrary code on
# the runner host. If a PR-based trigger is ever needed, either scope it to
# `runs-on: ubuntu-latest` (GitHub-hosted, disposable) instead of
# `self-hosted`, or unregister the self-hosted runner first.
# ============================================================================

on:
  schedule:
    - cron: "0 */2 * * *"
    # T-32 (#43): BF-week adaptive cadence. This tighter cron always fires,
    # but the `gate` job below (scripts/cadence_gate.py) only lets the real
    # scrape proceed when `now` falls inside the BF_PEAK_START_UTC /
    # BF_PEAK_END_UTC repository variables -- unset by default, so this
    # cron is a no-op outside a deliberately configured BF week. See
    # docs/runbooks/BF_WEEK_CADENCE.md.
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Deny-all by default; each job below grants back only what its own steps
# need (T-14, #21). GitHub Actions permissions are set per job, not per
# step, so the single previous job -- which only needed `contents: write`
# for its last step -- is split in two: everything before the commit runs
# read-only, and only the persistence job gets write access.
permissions: {}

concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  # T-32 (#43): fast (checkout + one script, no Playwright/uv setup), so
  # deciding "not now" on the 30-minute cron outside the BF peak window
  # costs seconds of self-hosted runner time, not a full scrape cycle.
  gate:
    runs-on: self-hosted
    permissions: {}
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether this trigger should scrape
        id: decide
        env:
          BF_PEAK_START_UTC: ${{ vars.BF_PEAK_START_UTC }}
          BF_PEAK_END_UTC: ${{ vars.BF_PEAK_END_UTC }}
          CADENCE_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: '& "C:\Program Files\Python312\python.exe" scripts/cadence_gate.py'

  scrape-analyze-notify:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: self-hosted
    permissions:
      contents: read
    outputs:
      restore_status: ${{ steps.restore_state.outputs.state_status }}
      save_status: ${{ steps.save_state.outputs.state_status }}
    env:
      PYTHON: C:\Program Files\Python312\python.exe
      # Pinned explicitly, same reasoning as PYTHON above: the runner service
      # account (NETWORK SERVICE) has its own profile, separate from the
      # interactive user's %LOCALAPPDATA%\ms-playwright default cache, so the
      # install step and the scrape step must agree on one fixed location
      # rather than relying on whichever account's per-profile default wins.
      PLAYWRIGHT_BROWSERS_PATH: C:\actions-runner\ms-playwright-cache
      # T-18 (#24): points uv's project venv at a runner-local path outside
      # the job workspace, so it survives across scheduled runs instead of
      # being rebuilt from scratch every time. `uv sync`/`uv run` both read
      # this when invoked from the project root.
      UV_PROJECT_ENVIRONMENT: C:\actions-runner\cache\bf-monitor\venv
      # B2 (#42): runner-local, ACL-protected directory holding the SQLite
      # backup, scrape_health.jsonl and alert_outbox.jsonl snapshots that
      # actions/checkout's workspace clean would otherwise erase every run.
      # Never a GitHub artifact -- this repo is public and artifact downloads
      # need only read access, which every signed-in GitHub user already has.
      # The exact ACL (SYSTEM + Administrators Full Control, this one service
      # SID Modify, no NETWORK SERVICE/Users/Authenticated Users/Everyone, no
      # inherited entries) is validated by scripts/runtime_state.py itself
      # before every restore/save; see docs/DECISIONS.md.
      BF_STATE_ROOT: C:\bf-monitor-runtime-state
      BF_STATE_MODIFY_PRINCIPAL: NT SERVICE\actions.runner.NaviAndrei-bf-price-monitor.PC-A1208
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # This job never pushes, so the checkout token (already read-only
          # via the job's `permissions` block) shouldn't even be left sitting
          # in .git/config for the rest of the job to find.
          persist-credentials: false

      # T-18 (#24): the fingerprint is a SHA-256 of uv.lock, which already
      # pins the Playwright package version (and therefore its browser
      # revision) alongside every other dependency -- one hash covers both
      # cache-invalidation triggers required by the issue.
      - name: Compute environment fingerprint
        id: fingerprint
        run: |
          $start = [datetime]::UtcNow
          Write-Output "start_epoch_ms=$([int64](($start - [datetime]'1970-01-01').TotalMilliseconds))" >> $env:GITHUB_OUTPUT
          $hash = (Get-FileHash -Algorithm SHA256 -Path uv.lock).Hash.ToLower()
          Write-Output "fingerprint=$hash" >> $env:GITHUB_OUTPUT

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"

      # T-18 (#24): a hit requires both the marker's stored fingerprint to
      # match today's uv.lock hash AND the venv directory to actually exist
      # -- either check failing alone falls back to a miss (full rebuild)
      # rather than trusting a marker that outlived its environment.
      - name: Check runner-local environment cache
        id: cache_check
        run: |
          $cacheDir = Split-Path $env:UV_PROJECT_ENVIRONMENT -Parent
          $markerPath = Join-Path $cacheDir "env.marker"
          $fp = "${{ steps.fingerprint.outputs.fingerprint }}"
          $hit = "false"
          if ((Test-Path $markerPath) -and (Test-Path $env:UV_PROJECT_ENVIRONMENT)) {
            $stored = (Get-Content $markerPath -Raw -ErrorAction SilentlyContinue)
            if ($stored -and $stored.Trim() -eq $fp) {
              $hit = "true"
            }
          }
          Write-Output "hit=$hit" >> $env:GITHUB_OUTPUT

      # uv sync installs from uv.lock with hash verification (uv.lock records
      # a sha256 per sdist/wheel) and installs the local bf_price_monitor
      # package directly from this checkout -- unlike pip's --require-hashes,
      # it doesn't refuse a local directory source, so both the pinned
      # third-party deps and the project itself go through one verified path.
      # --python pins the venv to the same interpreter NETWORK SERVICE can
      # see; every later `uv run` reuses that venv without re-specifying it.
      - name: Install dependencies
        if: steps.cache_check.outputs.hit != 'true'
        env:
          UV_HTTP_RETRIES: "8"
          UV_HTTP_TIMEOUT: "180"
        run: uv sync --frozen --python "$env:PYTHON"

      - name: Install Playwright browser
        if: steps.cache_check.outputs.hit != 'true'
        run: uv run --no-sync playwright install chromium

      # T-18 (#24): only refreshed after a real miss's install+browser steps
      # both succeeded (a step failure stops the job before reaching this
      # one), so the marker can never point at a partially-built environment.
      - name: Update environment cache marker
        if: steps.cache_check.outputs.hit != 'true'
        run: |
          $cacheDir = Split-Path $env:UV_PROJECT_ENVIRONMENT -Parent
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          Set-Content -Path (Join-Path $cacheDir "env.marker") -Value "${{ steps.fingerprint.outputs.fingerprint }}" -NoNewline

      - name: Report environment cache status
        if: always()
        run: |
          $status = if ("${{ steps.cache_check.outputs.hit }}" -eq "true") { "hit" } else { "miss" }
          $fp = "${{ steps.fingerprint.outputs.fingerprint }}"
          $fpPrefix = if ($fp.Length -ge 12) { $fp.Substring(0, 12) } else { $fp }
          $startMs = "${{ steps.fingerprint.outputs.start_epoch_ms }}"
          if ($startMs) {
            $nowMs = [int64]((([datetime]::UtcNow) - [datetime]'1970-01-01').TotalMilliseconds)
            $elapsedSec = [math]::Round(($nowMs - [int64]$startMs) / 1000, 1)
            Write-Output "runner cache: $status (fingerprint $fpPrefix, setup ${elapsedSec}s)"
          } else {
            Write-Output "runner cache: $status (fingerprint $fpPrefix, setup time unavailable)"
          }

      # B2 (#42): restores the last known-good SQLite/health/outbox snapshot
      # from the runner-local state directory before scraping touches any of
      # it, so cooldown, the dead-man check and scraper quarantine all see
      # the previous run even though actions/checkout just wiped this
      # workspace. continue-on-error so an insecure or corrupt state
      # directory never blocks the scrape itself -- the final "Verify
      # runtime state gate" step in the persist job is what makes that
      # visible instead.
      - name: Restore runtime state
        id: restore_state
        continue-on-error: true
        run: |
          uv run --no-sync scripts/runtime_state.py restore `
            --state-root "$env:BF_STATE_ROOT" `
            --run-id "${{ github.run_id }}" `
            --modify-principal "$env:BF_STATE_MODIFY_PRINCIPAL"

      # T-28 (#37): pulls pending alert-feedback button presses (getUpdates)
      # into the just-restored SQLite store, so the save step below carries
      # them forward. A no-op unless TELEGRAM_FEEDBACK_ALLOWED_USER_IDS is
      # set. continue-on-error: feedback must never block scraping or alerts.
      # Telegram keeps unconsumed updates for at most 24h, so gaps between
      # runs longer than that lose presses -- see docs/feedback-labels.md.
      - name: Collect alert feedback
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_FEEDBACK_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_FEEDBACK_ALLOWED_USER_IDS }}
        run: uv run --no-sync scripts/feedback.py collect

      - name: Scrape prices
        run: uv run --no-sync scripts/scrape.py

      - name: Analyze alerts
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run --no-sync scripts/analyze.py

      # T-26 (#35): the optional channels' secrets expand to "" when unset,
      # which notify.py treats as "channel not configured".
      - name: Send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_FEEDBACK_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_FEEDBACK_ALLOWED_USER_IDS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: uv run --no-sync scripts/notify.py

      # B2 (#42): if: always() so a crashed/failed scrape or notify step
      # still gets its outbox and health state saved -- a PENDING alert or a
      # SENT record from a run that failed partway through must survive to
      # the next run's replay/cooldown check, not just a clean run's. The
      # save only *promotes* its candidate snapshot to CURRENT after full
      # validation (SQLite integrity_check, JSONL parses, manifest hashes
      # match); on any failure the previous CURRENT is left untouched.
      # continue-on-error for the same reason as the restore step above: the
      # final "Verify runtime state gate" step is the one place this becomes
      # a visible, red failure.
      - name: Save runtime state
        id: save_state
        if: always()
        continue-on-error: true
        run: |
          uv run --no-sync scripts/runtime_state.py save `
            --state-root "$env:BF_STATE_ROOT" `
            --run-id "${{ github.run_id }}" `
            --modify-principal "$env:BF_STATE_MODIFY_PRINCIPAL"

      # This job has no write permission, so the updated data files can only
      # leave it via an artifact -- the persist job below downloads this
      # instead of trusting a shared runner filesystem between jobs.
      #
      # T-43 (#61): data/scrape_health.jsonl is included here too, purely so
      # it survives as a downloadable artifact -- the persist job's checkout
      # (clean: true) wipes anything untracked from the runner's local disk
      # before a later check could read it there, but an uploaded artifact
      # lives on GitHub's side independent of that. persist never reads or
      # commits this file; it is not added to persist's `git add` allowlist.
      - name: Upload updated data files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: price-data
          path: |
            data/price_history.json
            data/watchlist.json
            data/scrape_health.jsonl
          retention-days: 1

      # T-27 (#34): static, self-contained HTML report of this run (inline
      # CSS/SVG, no JavaScript, no CDN). Placed after the data upload and
      # marked continue-on-error so a report bug can never fail this job
      # and block the persist job's price-history commit.
      #
      # PRIVACY: the report holds the owner's watchlist and price data, so
      # it is published ONLY as a short-lived artifact, never GitHub Pages.
      # This repo is public and artifact downloads need only read access,
      # so the artifact is unlisted and expiring, not access-controlled.
      - name: Build HTML report
        if: always()
        continue-on-error: true
        run: uv run --no-sync scripts/report.py --data-dir data --output report/index.html

      - name: Upload HTML report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: price-report
          path: report/index.html
          if-no-files-found: warn
          retention-days: 7

      # T-16 (#26): runs even if scrape/analyze/notify failed, so a crashed
      # or timed-out run never leaves an orphaned Chromium process or stale
      # temp profile behind for the next scheduled run to inherit.
      #
      # T-42 (#60): the step's own default shell is already a working pwsh
      # process (proven by every other run: step above it succeeding without
      # an explicit `shell:`), but spawning a *second* `pwsh` by bare name
      # failed with "The term 'pwsh' is not recognized" -- the service
      # account's inherited PATH for that nested child-process lookup didn't
      # include pwsh's install directory, even though the runner agent's own
      # (PATH-independent) shell launch worked fine. Resolve the interpreter
      # explicitly instead of relying on a second PATH lookup, falling back
      # to Windows PowerShell (the script uses no PS7-only syntax), and fail
      # fast with a clear message instead of the opaque error if neither is
      # resolvable.
      - name: Runner cleanup
        if: always()
        run: |
          $exe = Get-Command pwsh -ErrorAction SilentlyContinue
          if (-not $exe) { $exe = Get-Command powershell -ErrorAction SilentlyContinue }
          if (-not $exe) {
            Write-Error "[runner_cleanup] Neither pwsh nor powershell.exe is resolvable on this runner's PATH -- cannot run cleanup. Verify PowerShell is installed and on the service account's PATH."
            exit 1
          }
          & $exe.Source -File scripts/runner_cleanup.ps1

  persist:
    needs: scrape-analyze-notify
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: price-data
          path: data

      - name: Commit updated price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/price_history.json data/watchlist.json
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: update price history [skip ci]"

            # Overlapping runs on this persistent self-hosted runner can each
            # start from the same origin/master tip and race to push -- rebase
            # onto the current remote tip immediately before pushing so a run
            # that finishes second integrates the other run's commit instead
            # of getting a non-fast-forward rejection.
                        if (Test-Path ".git/rebase-merge") { Remove-Item -Recurse -Force ".git/rebase-merge" }
            if (Test-Path ".git/rebase-apply") { Remove-Item -Recurse -Force ".git/rebase-apply" }
            git pull --rebase origin master
            if ($LASTEXITCODE -ne 0) {
              Write-Error "git pull --rebase failed -- likely a genuine content conflict in data/price_history.json between two runs' commits, not just the race this rebase is meant to absorb. Aborting the rebase so this persistent runner's checkout isn't left mid-rebase and blocking every subsequent scheduled run."
              git rebase --abort
              exit 1
            }

            git push
            if ($LASTEXITCODE -ne 0) {
              Write-Error "git push failed even after a successful rebase -- unexpected; needs manual investigation rather than a blind retry."
              exit 1
            }
          }

      - name: Ping healthcheck
        if: ${{ success() }}
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HEALTHCHECK_URL)) {
            Write-Output "[healthcheck] HEALTHCHECK_URL not set, skipping"
            exit 0
          }

          try {
            # -UseBasicParsing: this step's default shell resolved to Windows
            # PowerShell 5.1 (confirmed via a live run's step log), not pwsh.
            # Without it, Invoke-WebRequest tries to parse the response with
            # the Internet Explorer engine, which throws NotSupportedException
            # under the runner's headless service account (IE was never
            # first-launch configured for it). Harmless no-op on pwsh, where
            # basic parsing is already the only mode.
            $response = Invoke-WebRequest -Uri $env:HEALTHCHECK_URL -TimeoutSec 15 -UseBasicParsing
            if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 300) {
              Write-Output "[healthcheck] ping succeeded (HTTP $($response.StatusCode))"
            } else {
              Write-Warning "[healthcheck] ping returned non-success HTTP status $($response.StatusCode); monitor job remains successful"
            }
          } catch {
            # Never log $_.Exception.Message here -- Invoke-WebRequest's own
            # exception messages can embed the request URI, and this URL is
            # the Healthchecks.io credential (docs/security/secret-rotation-runbook.md).
            # Only the numeric HTTP status (if any) and the .NET exception
            # type name are safe to log.
            $statusCode = $null
            if ($_.Exception.PSObject.Properties.Name -contains 'Response' -and $_.Exception.Response) {
              try { $statusCode = [int]$_.Exception.Response.StatusCode } catch {}
            }
            $exType = $_.Exception.GetType().Name
            if ($statusCode) {
              Write-Warning "[healthcheck] ping received non-success HTTP status $statusCode (exception type: $exType); monitor job remains successful"
            } else {
              Write-Warning "[healthcheck] ping did not receive an HTTP response (exception type: $exType); monitor job remains successful"
            }
          }

      # B2 (#42): runs after price history is already committed, so a
      # runtime-state failure never costs the price data itself -- it only
      # turns this run visibly red instead of silently letting the next
      # run's cooldown/dead-man/quarantine checks operate on no prior state.
      # Deliberately no continue-on-error and no Write-Warning here: an
      # insecure state directory or a failed save must fail the workflow,
      # not just log a warning someone has to go looking for.
      - name: Verify runtime state gate
        if: always()
        run: |
          $restoreStatus = "${{ needs.scrape-analyze-notify.outputs.restore_status }}"
          $saveStatus = "${{ needs.scrape-analyze-notify.outputs.save_status }}"
          $okRestore = @('fresh_first_run', 'restored', 'restored_fallback', 'fresh_after_corruption') -contains $restoreStatus
          $okSave = @('saved') -contains $saveStatus
          if (-not $okRestore -or -not $okSave) {
            Write-Output "::error::Runtime state gate failed. restore_status='$restoreStatus' save_status='$saveStatus'. Cross-run cooldown/dead-man/quarantine safeguards may be operating on stale or missing state -- see scripts/runtime_state.py and C:\bf-monitor-runtime-state."
            exit 1
          }
          Write-Output "[state-gate] restore_status=$restoreStatus save_status=$saveStatus"

